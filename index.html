<style>
  :root {
    --navy: #002878;
    --gold: #B08D22;
    --green: #1a7a3a;
    --red: #b52a2a;
    --orange: #c55d00;
    --gray: #f4f5f7;
    --border: #dce1e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px;
         background: #f0f2f5; color: #222; display: flex; flex-direction: column; height: 100vh; }
  /* ── Header ── */
  header { background: var(--navy); color: #fff; padding: 12px 20px;
            display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  header h1 { font-size: 18px; font-weight: 700; }
  header .subtitle { font-size: 12px; opacity: .75; }
  .header-stats { margin-left: auto; display: flex; gap: 16px; font-size: 12px; }
  .stat-box { text-align: center; }
  .stat-num { font-size: 20px; font-weight: 700; display: block; }
  /* ── Layout ── */
  .main { display: flex; flex: 1; overflow: hidden; }
  /* ── Sidebar ── */
  .sidebar { width: 220px; background: #fff; border-right: 1px solid var(--border);
              padding: 16px 12px; overflow-y: auto; flex-shrink: 0; }
  .sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
                 color: #666; margin-bottom: 8px; margin-top: 16px; }
  .sidebar h3:first-child { margin-top: 0; }
  .filter-btn { display: block; width: 100%; text-align: left; padding: 6px 10px;
                 border-radius: 6px; border: none; background: none; cursor: pointer;
                 font-size: 13px; color: #333; margin-bottom: 2px; transition: background .15s; }
  .filter-btn:hover { background: #eef2fb; }
  .filter-btn.active { background: var(--navy); color: #fff; font-weight: 600; }
  .filter-btn .cnt { float: right; opacity: .6; font-size: 12px; }
  .search-wrap { margin-bottom: 8px; }
  .search-wrap input { width: 100%; padding: 7px 10px; border: 1px solid var(--border);
                         border-radius: 6px; font-size: 13px; outline: none; }
  .search-wrap input:focus { border-color: var(--navy); }
  /* ── Cards pane ── */
  .cards-pane { flex: 1; overflow-y: auto; padding: 16px; }
  .cards-grid { display: grid; gap: 12px; }
  /* ── Card ── */
  .card { background: #fff; border-radius: 8px; border: 1px solid var(--border);
           padding: 14px 16px; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .card-id { font-size: 11px; color: #888; font-weight: 600; white-space: nowrap; margin-top: 2px; }
  .card-title { font-size: 14px; font-weight: 600; color: var(--navy); flex: 1; line-height: 1.35; }
  .card-authors { font-size: 12px; color: #555; margin-bottom: 6px; }
  .card-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
            font-weight: 600; border: 1px solid; }
  .badge-organized { background: #e8f4e8; color: #1a7a3a; border-color: #a8d8a8; }
  .badge-proposed  { background: #fff8e1; color: #8a6200; border-color: #f5c842; }
  .badge-individual { background: #f0f4ff; color: #2c4ba0; border-color: #b0c0f0; }
  .badge-group { background: #f5f0fa; color: #6a0dad; border-color: #d0b8ea; font-weight: 400; }
  .card-keywords { font-size: 11px; color: #888; margin-bottom: 8px; }
  .card-footer { display: flex; align-items: center; gap: 8px; }
  .status-select { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
                    font-size: 12px; font-weight: 600; cursor: pointer; outline: none; flex-shrink: 0; }
  .status-select.s-pending    { background: #f5f5f5; color: #555; }
  .status-select.s-accept     { background: #e8f4e8; color: var(--green); border-color: #a8d8a8; }
  .status-select.s-poster     { background: #e8f0ff; color: #2c4ba0; border-color: #b0c0f0; }
  .status-select.s-waitlist   { background: #fff8e1; color: #8a6200; border-color: #f5c842; }
  .status-select.s-reject     { background: #ffeaea; color: var(--red); border-color: #f5b8b8; }
  .status-select.s-withdrawn  { background: #f0f0f0; color: #888; border-color: #ccc; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
  .sync-dot.synced  { background: #4caf50; }
  .sync-dot.syncing { background: #ff9800; animation: pulse .8s infinite; }
  .sync-dot.error   { background: #f44336; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
  /* ── Toolbar ── */
  .toolbar { background: #fff; border-bottom: 1px solid var(--border); padding: 10px 16px;
              display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .toolbar button { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
                     background: #fff; cursor: pointer; font-size: 13px; font-weight: 500;
                     transition: background .15s; }
  .toolbar button:hover { background: #eef2fb; }
  .toolbar button.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .toolbar button.primary:hover { background: #001c5c; }
  .sort-label { font-size: 12px; color: #666; margin-left: auto; }
  .count-label { font-size: 13px; color: #444; }
  /* ── Empty state ── */
  .empty { text-align: center; padding: 48px 24px; color: #aaa; font-size: 14px; }
</style>
</head>

<header>

    <div class="subtitle">Chinese Economists Society · ASSA 2027 · San Francisco, CA</div>
  </div>

    <div class="stat-box"><span class="stat-num" id="statTotal">0</span>Total</div>

    <div class="stat-box"><span class="stat-num" id="statReject" style="color:#f08080">0</span>Rejected</div>
    <div class="stat-box"><span class="stat-num" id="statPending" style="color:#ffd166">0</span>Pending</div>
  </div>
</header>

<div class="toolbar">
  <button class="primary" onclick="exportCSV()">Export CSV</button>
  <button onclick="exportAcceptedCSV()">Export Accepted</button>
  <button onclick="resetAllStatus()" style="color:#b52a2a">Reset All</button>
  <div class="count-label"><span id="showingCount">0</span> papers shown</div>
  <div class="sort-label">
    Sort: <select id="sortSelect" onchange="renderCards()" style="border:1px solid #dce1e8;border-radius:4px;padding:3px 6px;font-size:12px;">
      <option value="id">ID</option>
      <option value="title">Title</option>
      <option value="status">Status</option>
      <option value="type">Type</option>
    </select>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search title / author / keyword…" oninput="renderCards()">
    </div>

    <h3>Status</h3>
    <button class="filter-btn active" data-filter="status:all" onclick="setFilter(this)">All <span class="cnt" id="cntAll">0</span></button>
    <button class="filter-btn" data-filter="status:Pending" onclick="setFilter(this)">Pending <span class="cnt" id="cntPending">0</span></button>
    <button class="filter-btn" data-filter="status:Accept" onclick="setFilter(this)">Accept (Oral) <span class="cnt" id="cntAccept">0</span></button>
    <button class="filter-btn" data-filter="status:Poster" onclick="setFilter(this)">Accept (Poster) <span class="cnt" id="cntPoster">0</span></button>
    <button class="filter-btn" data-filter="status:Waitlist" onclick="setFilter(this)">Waitlist <span class="cnt" id="cntWaitlist">0</span></button>
    <button class="filter-btn" data-filter="status:Reject" onclick="setFilter(this)">Reject <span class="cnt" id="cntReject">0</span></button>
    <button class="filter-btn" data-filter="status:Withdrawn" onclick="setFilter(this)">Withdrawn <span class="cnt" id="cntWithdrawn">0</span></button>

    <h3>Type</h3>
    <button class="filter-btn" data-filter="type:all" onclick="setFilter(this)">All Types</button>
    <button class="filter-btn" data-filter="type:Organized" onclick="setFilter(this)">Organized Session</button>
    <button class="filter-btn" data-filter="type:Proposed" onclick="setFilter(this)">Proposed Session</button>
    <button class="filter-btn" data-filter="type:Individual" onclick="setFilter(this)">Individual Submission</button>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div class="cards-pane" id="cardsPane">
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
  </div>
</div>

// ── State ────────────────────────────────────────────────────────────────────
let paperStates = {};   // id -> status string
let activeFilter = 'status:all';
let syncDots = {};

const STATUSES = ['Pending','Accept','Poster','Waitlist','Reject','Withdrawn'];
const STATUS_CLASS = {
  'Pending': 's-pending', 'Accept': 's-accept', 'Poster': 's-poster',
  'Waitlist': 's-waitlist', 'Reject': 's-reject', 'Withdrawn': 's-withdrawn'
};

// ── Firebase sync ─────────────────────────────────────────────────────────────
function fbRef(id) { return db.ref(`${FB_NODE}/states/${id}`); }

function loadFromFirebase() {
  db.ref(`${FB_NODE}/states`).on('value', snap => {
    const data = snap.val() || {};
    PAPERS.forEach(p => { paperStates[p.id] = data[p.id] || 'Pending'; });
    updateCounters();
    renderCards();
  });
}

function saveStatus(id, status) {
  const dot = document.getElementById('dot-' + id);
  if (dot) { dot.className = 'sync-dot syncing'; }
  fbRef(id).set(status)
    .then(() => { if (dot) dot.className = 'sync-dot synced'; })
    .catch(() => { if (dot) dot.className = 'sync-dot error'; });
}

// ── Filter / search ───────────────────────────────────────────────────────────
function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  renderCards();
}

function matchesFilter(p) {
  const q = document.getElementById('searchInput').value.toLowerCase();
  if (q) {
    const haystack = (p.title + ' ' + p.authors + ' ' + p.keywords + ' ' + p.group).toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  if (activeFilter.startsWith('status:')) {
    const s = activeFilter.split(':')[1];
    if (s !== 'all' && paperStates[p.id] !== s) return false;
  }
  if (activeFilter.startsWith('type:')) {
    const t = activeFilter.split(':')[1];
    if (t !== 'all' && p.type !== t) return false;
  }
  return true;
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderCards() {
  const sort = document.getElementById('sortSelect').value;
  let papers = PAPERS.filter(matchesFilter);
  papers.sort((a, b) => {
    if (sort === 'title')  return a.title.localeCompare(b.title);
    if (sort === 'status') return STATUSES.indexOf(paperStates[a.id]) - STATUSES.indexOf(paperStates[b.id]);
    if (sort === 'type')   return a.type.localeCompare(b.type) || a.id.localeCompare(b.id);
    return a.id.localeCompare(b.id);
  });

  document.getElementById('showingCount').textContent = papers.length;

  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = papers.length === 0
    ? '<div class="empty">No papers match the current filter.</div>'
    : papers.map(cardHTML).join('');

  papers.forEach(p => {
    const sel = document.getElementById('sel-' + p.id);
    if (sel) sel.className = 'status-select ' + (STATUS_CLASS[paperStates[p.id]] || 's-pending');
  });
}

function cardHTML(p) {
  const status = paperStates[p.id] || 'Pending';
  const selClass = STATUS_CLASS[status] || 's-pending';
  const typeBadge = p.type === 'Organized' ? 'badge-organized' :
                    p.type === 'Proposed'  ? 'badge-proposed'  : 'badge-individual';
  const groupBadge = p.group ? `<span class="badge badge-group" title="Session: ${escHtml(p.group)}">
    ${escHtml(p.group.length > 45 ? p.group.slice(0,43)+'…' : p.group)}</span>` : '';

  const options = STATUSES.map(s =>
    `<option value="${s}" ${s === status ? 'selected' : ''}>${s === 'Accept' ? 'Accept (Oral)' : s === 'Poster' ? 'Accept (Poster)' : s}</option>`
  ).join('');

  return `<div class="card" id="card-${p.id}">
    <div class="card-header">
      <span class="card-id">${p.id}</span>
      <span class="card-title">${escHtml(p.title)}</span>
    </div>
    <div class="card-authors">${escHtml(p.authors)}</div>
    <div class="card-meta">
      <span class="badge ${typeBadge}">${p.type}</span>
      ${groupBadge}
    </div>
    ${p.keywords ? `<div class="card-keywords">Keywords: ${escHtml(p.keywords)}</div>` : ''}
    <div class="card-footer">
      <select class="status-select ${selClass}" id="sel-${p.id}"
              onchange="onStatusChange('${p.id}', this)">
        ${options}
      </select>
      <span class="sync-dot" id="dot-${p.id}"></span>
      ${p.presenter ? `<span style="font-size:11px;color:#777">Presenter: ${escHtml(p.presenter)}</span>` : ''}
      ${p.email ? `<a href="mailto:${escHtml(p.email)}" style="font-size:11px;color:#888">✉</a>` : ''}
    </div>
  </div>`;
}

function onStatusChange(id, sel) {
  const status = sel.value;
  paperStates[id] = status;
  sel.className = 'status-select ' + (STATUS_CLASS[status] || 's-pending');
  saveStatus(id, status);
  updateCounters();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Counters ──────────────────────────────────────────────────────────────────
function updateCounters() {
  const counts = {Pending:0,Accept:0,Poster:0,Waitlist:0,Reject:0,Withdrawn:0};
  PAPERS.forEach(p => { const s = paperStates[p.id] || 'Pending'; if (counts[s]!==undefined) counts[s]++; });
  const total = PAPERS.length;
  document.getElementById('statTotal').textContent   = total;
  document.getElementById('statAccept').textContent  = counts.Accept + counts.Poster;
  document.getElementById('statReject').textContent  = counts.Reject;
  document.getElementById('statPending').textContent = counts.Pending;

  document.getElementById('cntAll').textContent       = total;
  document.getElementById('cntPending').textContent   = counts.Pending;
  document.getElementById('cntAccept').textContent    = counts.Accept;
  document.getElementById('cntPoster').textContent    = counts.Poster;
  document.getElementById('cntWaitlist').textContent  = counts.Waitlist;
  document.getElementById('cntReject').textContent    = counts.Reject;
  document.getElementById('cntWithdrawn').textContent = counts.Withdrawn;
}

// ── Exports ───────────────────────────────────────────────────────────────────
function exportCSV() {
  let csv = 'ID,Title,Authors,Presenter,Email,Affiliation,Type,Group,Status,Keywords\n';
  PAPERS.forEach(p => {
    const row = [p.id, p.title, p.authors, p.presenter, p.email, p.affiliation,
                 p.type, p.group, paperStates[p.id]||'Pending', p.keywords]
      .map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(',');
    csv += row + '\n';
  });
  downloadCSV(csv, 'ces2027_assa_all_papers.csv');
}

function exportAcceptedCSV() {
  const accepted = PAPERS.filter(p => paperStates[p.id] === 'Accept' || paperStates[p.id] === 'Poster');
  if (!accepted.length) { alert('No accepted papers yet.'); return; }
  let csv = 'ID,Title,Authors,Presenter,Email,Affiliation,Type,Group,Status,Keywords\n';
  accepted.forEach(p => {
    const row = [p.id, p.title, p.authors, p.presenter, p.email, p.affiliation,
                 p.type, p.group, paperStates[p.id], p.keywords]
      .map(v => '"' + String(v||'').replace(/"/g,'""') + '"').join(',');
    csv += row + '\n';
  });
  downloadCSV(csv, 'ces2027_assa_accepted.csv');
}

function downloadCSV(csv, filename) {
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function resetAllStatus() {
  if (!confirm('Reset ALL papers to Pending? This cannot be undone.')) return;
  PAPERS.forEach(p => { paperStates[p.id] = 'Pending'; });
  db.ref(`${FB_NODE}/states`).set({});
  updateCounters();
  renderCards();
}

// ── Init ──────────────────────────────────────────────────────────────────────
PAPERS.forEach(p => { paperStates[p.id] = 'Pending'; });
loadFromFirebase();
</script>
